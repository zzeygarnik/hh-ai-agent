<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>HH AI Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">HH <span class="accent">AI Agent</span></div>
    <nav>
      <button class="nav-btn active" data-tab="settings">Настройки</button>
      <button class="nav-btn" data-tab="run">Логи и запуск</button>
    </nav>
  </aside>

  <main class="content">
    <section id="tab-settings" class="tab active">
      <h1>Настройки</h1>

      <div class="field">
        <label>Telegram Bot Token</label>
        <input type="password" id="TG_BOT_TOKEN">
      </div>
      <div class="field">
        <label>Telegram User ID</label>
        <input type="text" id="TG_USER_ID">
      </div>

      <h2>LLM провайдер</h2>
      <div class="segmented" id="provider-toggle">
        <button type="button" data-value="deepseek" class="seg-btn active">DeepSeek (облако)</button>
        <button type="button" data-value="ollama" class="seg-btn">Ollama (локально)</button>
      </div>

      <div id="deepseek-fields">
        <div class="field">
          <label>DeepSeek API Key</label>
          <input type="password" id="DEEPSEEK_API_KEY">
        </div>
        <div class="field">
          <label>DeepSeek модель</label>
          <input type="text" id="DEEPSEEK_MODEL">
        </div>
      </div>

      <div id="ollama-fields" class="hidden">
        <div class="field">
          <label>Ollama URL</label>
          <input type="text" id="OLLAMA_URL">
        </div>
        <div class="field">
          <label>Ollama модель</label>
          <input type="text" id="OLLAMA_MODEL">
        </div>
      </div>

      <h2>Профиль</h2>
      <div class="field">
        <label>Твоё имя (подпись в письмах)</label>
        <input type="text" id="MY_NAME">
      </div>
      <div class="field">
        <label>Ссылка на GitHub</label>
        <input type="text" id="MY_GITHUB">
      </div>
      <div class="field">
        <label>Пет-проект (опционально)</label>
        <input type="text" id="MY_PET_PROJECT">
      </div>
      <div class="field">
        <label>Название резюме на HH</label>
        <input type="text" id="TARGET_RESUME_NAME">
      </div>

      <h2>Поиск вакансий</h2>
      <div class="field">
        <label>Поисковые запросы (по одному на строку)</label>
        <textarea id="SEARCH_QUERIES" rows="5"></textarea>
      </div>

      <h2>Резюме (для сопроводительных писем)</h2>
      <div class="field">
        <textarea id="MY_RESUME_SUMMARY" rows="8"></textarea>
      </div>

      <button id="save-btn" class="btn-primary">Сохранить</button>
      <span id="save-status" class="save-status"></span>
    </section>

    <section id="tab-run" class="tab">
      <h1>Логи и запуск</h1>

      <div class="run-bar">
        <div id="status-pill" class="status-pill stopped"><span class="dot"></span> Остановлен</div>
        <button id="start-btn" class="btn-primary">Запустить бота</button>
        <button id="stop-btn" class="btn-outline" disabled>Остановить</button>
      </div>

      <pre id="log-box" class="log-box"></pre>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
